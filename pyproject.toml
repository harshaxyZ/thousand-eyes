[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "thousand-eyes"
version = "0.6.0"
description = "Thousand Eyes wildfire - evidence-only OSINT self-audit. One lead in, an impact-ranked web of public proof out. Default mode is LLM-free; --agent adds an LLM planner behind the same fence. No credential probes, no invented findings."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Proprietary" }
dependencies = [
    "httpx>=0.27,<0.29",
    "pyyaml>=6.0,<7.0",
    "rich>=13,<16",
    "textual>=0.60,<1.0",
]

[project.optional-dependencies]
banner = ["numpy>=1.26,<3"]   # animated startup banner only; scans never touch it
dev = [
    "pytest==8.3.3",
    "pytest-asyncio==0.24.0",
]

[project.scripts]
thousand-eyes = "thousand_eyes.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
thousand_eyes = ["data/*.yaml", "data/*.json"]
