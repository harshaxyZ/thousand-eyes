[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "thousand-eyes"
version = "0.6.0"
description = "Thousand Eyes wildfire - evidence-only OSINT self-audit. One lead in, an impact-ranked web of public proof out. Default mode is LLM-free; --agent adds an LLM planner behind the same fence. No credential probes, no invented findings."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "harshaxyZ" }]
keywords = ["osint", "self-audit", "footprint", "privacy", "recon", "whatsmyname"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
]
dependencies = [
    "httpx>=0.27,<0.29",
    "pyyaml>=6.0,<7.0",
    "rich>=13,<16",
    "textual>=0.60,<1.0",
]

[project.urls]
Homepage = "https://github.com/harshaxyZ/thousand-eyes"
Changelog = "https://github.com/harshaxyZ/thousand-eyes/blob/main/CHANGELOG.md"
Issues = "https://github.com/harshaxyZ/thousand-eyes/issues"

[project.optional-dependencies]
banner = ["numpy>=1.26,<3"]   # animated startup banner only; scans never touch it
dev = [
    "pytest==8.3.3",
    "pytest-asyncio>=1.4,<2",
]

[project.scripts]
thousand-eyes = "thousand_eyes.cli:main"
thousand-eyes-banner = "thousand_eyes.banner:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
thousand_eyes = ["data/*.yaml", "data/*.json"]
